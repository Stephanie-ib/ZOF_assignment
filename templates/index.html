<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOF Solver - Numerical Analysis</title>
    <style>
        :root {
            --primary-blue: #1e40af;
            --secondary-blue: #3b82f6;
            --light-blue: #60a5fa;
            --vanilla: #fef3c7;
            --vanilla-light: #fffbeb;
            --vanilla-dark: #fde68a;
            --bg-gradient-start: #fef3c7;
            --bg-gradient-end: #dbeafe;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --border-color: #bfdbfe;
            --success-green: #059669;
            --error-red: #dc2626;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(30, 64, 175, 0.1);
            border: 2px solid var(--vanilla-dark);
        }
        
        .header h1 { 
            color: var(--primary-blue);
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(254, 243, 199, 0.3);
        }
        
        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin: 0;
        }
        
        /* Form Styling */
        .solver-card {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.15);
            margin-bottom: 30px;
            border: 3px solid var(--vanilla);
            position: relative;
            overflow: hidden;
        }
        
        .solver-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-blue), var(--light-blue), var(--vanilla-dark));
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--primary-blue);
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--vanilla-light);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--secondary-blue);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        
        input:hover, select:hover {
            border-color: var(--light-blue);
        }
        
        .full-width { grid-column: 1 / -1; }
        
        button {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--secondary-blue) 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        
        button:hover::before {
            left: 100%;
        }
        
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 64, 175, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled { 
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Input Groups (Hidden by default) */
        .input-group { display: none; }
        .input-group.active { display: block; }

        /* Results Table */
        .results-card {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.15);
            border: 3px solid var(--vanilla);
            display: none;
            position: relative;
            overflow: hidden;
        }
        
        .results-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--vanilla-dark), var(--light-blue), var(--primary-blue));
        }
        
        .results-card h2 {
            color: var(--primary-blue);
            margin-top: 0;
            margin-bottom: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 20px;
            font-size: 0.95rem;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(30, 64, 175, 0.1);
        }
        
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 2px solid var(--vanilla);
        }
        
        th {
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
        
        tbody tr {
            background: var(--vanilla-light);
            transition: all 0.3s ease;
        }
        
        tbody tr:nth-child(even) {
            background: #ffffff;
        }
        
        tbody tr:hover {
            background: #dbeafe;
            transform: scale(1.01);
        }
        
        td {
            color: var(--text-primary);
        }
        
        .success { 
            color: var(--success-green);
            font-weight: bold;
            padding: 12px 20px;
            background: #d1fae5;
            border-radius: 10px;
            border-left: 4px solid var(--success-green);
        }
        
        .error-msg { 
            color: var(--error-red);
            font-weight: bold;
            padding: 12px 20px;
            background: #fee2e2;
            border-radius: 10px;
            border-left: 4px solid var(--error-red);
        }
        
        .formula-hint {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 6px;
            padding: 8px 12px;
            background: rgba(59, 130, 246, 0.05);
            border-radius: 6px;
            border-left: 3px solid var(--light-blue);
        }
        
        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--vanilla-light);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--secondary-blue);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-blue);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Zero of Functions (ZOF) Solver</h1>
        <p>Numerical Methods Project</p>
    </div>

    <div class="solver-card">
        <form id="solverForm">
            <div class="form-grid">
                <!-- Method Selection -->
                <div class="form-group full-width">
                    <label for="method">Select Method</label>
                    <select name="method" id="method" onchange="updateForm()">
                        <option value="bisection">Bisection Method</option>
                        <option value="regula_falsi">Regula Falsi (False Position)</option>
                        <option value="secant">Secant Method</option>
                        <option value="newton">Newton-Raphson Method</option>
                        <option value="fixed_point">Fixed Point Iteration</option>
                        <option value="mod_secant">Modified Secant Method</option>
                    </select>
                </div>

                <!-- Function Input -->
                <div class="form-group full-width">
                    <label for="function">Function f(x) or g(x)</label>
                    <input type="text" name="function" id="function" required placeholder="e.g., x**3 - x - 2">
                    <div class="formula-hint">Use Python syntax: x**2 for x², sin(x), exp(x). For Fixed Point, enter g(x).</div>
                </div>

                <!-- Derivative (Newton only) -->
                <div class="form-group input-group" id="grp-deriv">
                    <label for="derivative">Derivative f'(x)</label>
                    <input type="text" name="derivative" placeholder="e.g., 3*x**2 - 1">
                </div>

                <!-- Initial Guesses -->
                <div class="form-group input-group" id="grp-a">
                    <label for="param_a">Lower Bound (a)</label>
                    <input type="number" step="any" name="param_a">
                </div>
                <div class="form-group input-group" id="grp-b">
                    <label for="param_b">Upper Bound (b)</label>
                    <input type="number" step="any" name="param_b">
                </div>
                
                <div class="form-group input-group" id="grp-x0">
                    <label for="param_x0">Initial Guess (x0)</label>
                    <input type="number" step="any" name="param_x0">
                </div>
                <div class="form-group input-group" id="grp-x1">
                    <label for="param_x1">Second Guess (x1)</label>
                    <input type="number" step="any" name="param_x1">
                </div>

                <div class="form-group input-group" id="grp-delta">
                    <label for="param_delta">Delta (Perturbation)</label>
                    <input type="number" step="any" name="param_delta" value="0.01">
                </div>

                <!-- Settings -->
                <div class="form-group">
                    <label for="tolerance">Tolerance</label>
                    <input type="number" step="any" name="tolerance" value="0.0001" required>
                </div>
                <div class="form-group">
                    <label for="max_iter">Max Iterations</label>
                    <input type="number" name="max_iter" value="50" required>
                </div>

                <div class="form-group full-width">
                    <button type="submit" id="submitBtn">Calculate Root</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Results Section -->
    <div class="results-card" id="resultsCard">
        <h2 style="margin-top: 0;">Computation Results</h2>
        <div id="statusMessage"></div>
        
        <div style="overflow-x: auto;">
            <table id="resultsTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Iter</th>
                        <th>Root Estimate</th>
                        <th>Value</th>
                        <th>Abs Error</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <!-- Rows injected via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function updateForm() {
        const method = document.getElementById('method').value;
        
        // Hide all dynamic groups
        document.querySelectorAll('.input-group').forEach(el => el.classList.remove('active'));
        
        // Show specific groups
        if (method === 'bisection' || method === 'regula_falsi') {
            document.getElementById('grp-a').classList.add('active');
            document.getElementById('grp-b').classList.add('active');
        } else if (method === 'secant') {
            document.getElementById('grp-x0').classList.add('active');
            document.getElementById('grp-x1').classList.add('active');
        } else if (method === 'newton') {
            document.getElementById('grp-deriv').classList.add('active');
            document.getElementById('grp-x0').classList.add('active');
        } else if (method === 'fixed_point') {
            document.getElementById('grp-x0').classList.add('active');
        } else if (method === 'mod_secant') {
            document.getElementById('grp-x0').classList.add('active');
            document.getElementById('grp-delta').classList.add('active');
        }
    }

    // Handle Form Submission
    document.getElementById('solverForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const resultsCard = document.getElementById('resultsCard');
        const statusMsg = document.getElementById('statusMessage');
        const table = document.getElementById('resultsTable');
        const tbody = document.getElementById('resultsBody');
        
        // UI Loading State
        btn.disabled = true;
        btn.innerText = "Calculating...";
        resultsCard.style.display = 'none';
        tbody.innerHTML = '';

        const formData = new FormData(this);

        try {
            const response = await fetch('/', {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            
            resultsCard.style.display = 'block';
            
            if (result.error) {
                statusMsg.innerHTML = `<p class="error-msg">${result.error}</p>`;
                table.style.display = 'none';
            } else {
                // Success Status
                if (result.converged) {
                    statusMsg.innerHTML = `<p class="success">Converged to Root: ${result.root}</p>`;
                } else {
                    statusMsg.innerHTML = `<p class="error-msg">Did not converge within max iterations.</p>`;
                }
                
                // Build Table
                table.style.display = 'table';
                result.data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.iter}</td>
                        <td>${row.root}</td>
                        <td>${row.func}</td>
                        <td>${row.error}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            
        } catch (error) {
            resultsCard.style.display = 'block';
            statusMsg.innerHTML = `<p class="error-msg">System Error: ${error.message}</p>`;
            table.style.display = 'none';
        } finally {
            btn.disabled = false;
            btn.innerText = "Calculate Root";
        }
    });

    // Initialize on load
    window.onload = updateForm;
</script>

</body>
</html>
